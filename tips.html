<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gaming tips to help you finish your backlog faster">
  <title>Gaming Tips - Pile of Shame</title>
  <!-- Bootstrap CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- bootstrap icons (for the footer social links) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <!-- bootstrap js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/tips.js" defer></script>
</head>

<body>
  <!-- main.js fills the header and footer (shared on every page) -->
  <header></header>
  <main class="container">
    <h1>Gaming Tips</h1>

    <!-- tip of the day-->
    <section class="my-4">
      <div class="alert alert-info" role="alert">
        <h4 class="alert-heading">💡 Tip of the Day</h4>
        <p class="mb-0" id="tipOfDay"></p>
      </div>
    </section>

    <!-- backlog tips accordion-->
    <section class="my-4">
      <h2>Backlog Tips</h2>
      <div class="accordion" id="tipsAccordion">
        <!-- tips.js fills this -->
      </div>
    </section>

    <!-- random picker -->
    <section class="my-4">
      <h2>Can't Decide What to Play?</h2>
      <p>Let Pile of Shame pick a random game from your backlog.</p>

      <button id="pickButton" class="btn btn-primary" type="button">Pick a game for me</button>

      <!-- the suggestion appears here -->
      <div id="pickResult" class="mt-3"></div>
    </section>

  </main>


  <footer></footer>
</body>

</html>
