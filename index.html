<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pile of Shame - track your video game backlog and beat the pile">
  <title>Home - Pile of Shame</title>
  <!-- Bootstrap CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- bootstrap icons (for the footer social links) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <!-- the chart.js library is used to create charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="js/home.js" defer></script>
</head>

<body>
  <!-- main.js injects the header and footer which is the same on every page (to minimize repetition) -->
  <header></header>

  <main class="container">

    <!-- welcome section.
     p-5 = big padding, 
     bg-body-tertiary = a theme-aware background,
     rounded = rounded corners. -->
    <section class="p-5 my-4 bg-body-tertiary rounded text-center">
      <h1 class="display-4">Pile of Shame</h1>

      <!-- lead = slightly bigger intro paragraph -->
      <p class="lead">
        Bought but never finished...
        Pile of Shame helps you track your backlog, set priorities and finally destroy the pile.
      </p>

      <!-- button that takes the user to the Backlog page-->
      <a href="backlog.html" class="btn btn-primary btn-lg">Go to my Backlog</a>
    </section>

    <section class="my-4">
      <h2>Latest Activity</h2>

      <ul class="list-group" id="activityList">
        <!-- home.js fills this -->
      </ul>
    </section>

    <!-- progress chart (filled with home.js) -->
    <section class="my-4">
      <h2>My Progress</h2>
      <div class="row">
        <div class="col-md-6">
          <canvas id="statusChart"></canvas>
        </div>
      </div>
    </section>

    <!-- game deals from the CheapShark API (filled with home.js) -->
    <section class="my-4">
      <h2>Today's Game Deals</h2>
      <p>Grab something cheap to add to the pile.</p>

      <!-- home.js fills this row with deal cards -->
      <div class="row" id="dealsContainer">
        <!-- failsafe -->
        <p>Loading deals...</p>
      </div>
    </section>

  </main>

  <footer></footer>
</body>

</html>
